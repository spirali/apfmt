[[item]]
id = 'generics-on-one-line'
name = 'Generics clauses stay on one line'
summary = 'apfmt keeps a generics clause on one line and breaks the parameters or the return type instead; rustfmt breaks the generics too.'
description = '''
The Style Guide says: "Prefer to put a generics clause on one line. Break other parts of an item declaration rather than line-breaking a generics clause." rustfmt breaks the generics and the parameters, and apfmt breaks only the parameters.

With no parameters to break, a return type that does not fit with ` {` moves to the next line. rustfmt does so for a short generics clause only from 102 columns. Up to 101 columns it keeps the return type on the line and puts `{` on its own line, which is one column over `max_width` at 101. It breaks a generics clause that does not fit with the return type instead.
'''
rationale = 'This is the Style Guide rule.'
level = "medium"
tags = ['generics', 'fn']

