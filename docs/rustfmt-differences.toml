[[item]]
id = 'unsafe-last-operand-brace'
name = '`{` after an `unsafe` block ending a broken head'
summary = 'apfmt puts `{` on its own line after an `unsafe` block ending a broken head; rustfmt writes `} {`.'
description = '''
When a broken control line ends with an `unsafe` block, apfmt puts `{` on its own line, as after any broken control line. rustfmt puts it after the closing `}`, as `} {`. apfmt keeps a block on its operator's line only for a plain block as the last operand.
'''
rationale = 'It is then like any broken control line. Neither layout is clearly better.'
level = "low"
tags = ['if', 'block']

[item.style_guide]
conforms = "unspecified"

[[item.samples]]
title = 'An `unsafe` operand'
edition = "2024"
input = '''
fn main() {
    {
        {
            {
                {
                    let (b, count) = if count == 0 && unsafe { std::ptr::eq(b.as_ptr().add(b.len()), bytes.as_ptr().add(bytes.len())) } {
                        1
                    } else {
                        2
                    };
                }
            }
        }
    }
}
'''
show_input = false

