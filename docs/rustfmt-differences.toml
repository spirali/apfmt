[[item]]
id = 'type-annotation-next-line'
name = 'A type annotation that does not fit goes on the next line'
summary = 'apfmt moves a type that fits nowhere on the line of `:` to the next line, also for a `let`; rustfmt leaves such a `let` unformatted.'
description = '''
When a type does not fit, both formatters keep it on the line of `:` and break inside it if they can, although the Style Guide breaks after `:` first. If no layout on that line fits, apfmt moves the type to the next line, block-indented, including for a `let`. rustfmt does that only for `const` and `static`, and leaves such a `let` unformatted.
'''
rationale = 'The statement gets formatted instead of being left as written.'
level = "low"
tags = ['let', 'type', 'give-up']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/statements.html"
conforms = "neither"

