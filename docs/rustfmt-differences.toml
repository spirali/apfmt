[[item]]
id = 'filled-call-arguments'
name = 'Filled call arguments'
summary = 'Both fill simple call arguments on lines, but apfmt measures comments exactly, keeps a comment after `(` in place and does not fill multi-line strings.'
description = '''
Both formatters fill simple call arguments on lines, several per line, although the Style Guide asks for one argument per line. They differ in three details:

- **Comment widths are measured exactly.** rustfmt reserves 6 columns more than a comment needs, so apfmt fits more items on a line.
- **A comment ending the line of `(` stays there**, as in all other lists. rustfmt moves it to the next line.
- **A multi-line string literal is not a short item**, so apfmt does not fill arguments that include one. rustfmt fills them when the text of the literal is at most `short_array_element_width_threshold` long.
'''
rationale = 'Filling itself follows rustfmt. Exact measurement uses the full line width, and a multi-line string is not a short item.'
level = "medium"
tags = ['call', 'comment', 'string']
related = ['comment-after-opener-stays']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/expressions.html"
conforms = "neither"

