[[item]]
id = 'struct-variants-layout'
name = 'Only struct variants decide the layout of struct variants'
summary = 'apfmt applies the Style Guide rule to all struct variants and only to them; rustfmt also reacts to tuple variants and skips some struct variants.'
description = '''
The Style Guide says: "In an enum with multiple struct variants, if any struct variant is written on multiple lines, use the multi-line formatting for all struct variants." apfmt applies this to every struct variant and to struct variants only. rustfmt differs in two ways:

- It also breaks all struct variants when a *tuple* variant is multi-line.
- It leaves out variants with an attribute or a doc comment, which stay on one line next to a multi-line struct variant.
'''
rationale = '''This is the Style Guide rule, without rustfmt's two extensions to it.'''
level = "medium"
tags = ['enum']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/items.html"
quote = 'In an enum with multiple struct variants, if any struct variant is written on multiple lines, use the multi-line formatting for all struct variants.'
conforms = "apfmt"

