[[item]]
id = 'todo-format-string-macros'
name = '`todo!` and `unimplemented!` are format-string macros'
summary = 'apfmt treats `todo!` and `unimplemented!` as format-string macros; rustfmt does not.'
description = '''
The Style Guide has a layout for macros that take a format string: the arguments in front of the format string on one line, the format string on its own line, and the arguments after it on one line, when they are all simple. rustfmt has a fixed list of such macros that does not include `todo!` and `unimplemented!`, so it puts their arguments one per line.
'''
rationale = 'Both macros take a format string, so the Style Guide layout applies to them.'
level = "low"
tags = ['macro']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/expressions.html"
conforms = "apfmt"

[[item.samples]]
title = 'Both macros'
edition = "2024"
input = '''
fn f() {
    todo!("a very long format string with {} and {} and {} placeholders xxxxxxxxxxxxxxxxxxx", e, g);
    unimplemented!("a very long format string with {} and {} and {} placeholders xxxxxxxxxx", e, g);
}
'''
show_input = false

