[[item]]
id = 'aligned-closure-params-details'
name = 'Details of the aligned closure parameters'
summary = 'Both align broken closure parameters, but differ in the return type, blank lines and broken patterns.'
description = '''
Both formatters align closure parameters that do not fit on one line after `|`, although the Style Guide asks for block indentation and a trailing comma. apfmt differs in the details:

- A return type goes on a line of its own, aligned with the parameters. rustfmt indents it one column past the statement after `let`.
- Parameters with blank lines between them stay on the line of `=`, where rustfmt moves them.
- A parameter pattern that breaks stays aligned.
'''
rationale = 'Aligning itself follows rustfmt; apfmt differs only in these details.'
level = "low"
tags = ['closure']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/expressions.html"
conforms = "neither"

