[[item]]
id = 'overflowing-lines-do-not-decide'
name = 'Lines that overflow anyway do not decide the layout around them'
summary = 'apfmt does not hug a closure just to save indentation for a line that overflows anyway; rustfmt gives up on such a closure body.'
description = '''
A line that overflows `max_width` in every layout, such as a long comment or a macro call that cannot be broken, overflows by only a few more columns when indented deeper, however long it is. apfmt therefore does not hug a closure to save that line a level of indentation if the line of the call then overflows. rustfmt gives up on such a closure body: it copies it unchanged after putting the arguments one per line. apfmt formats the body, and moves the right side of a `let` to the next line when the call then fits there.

With `overflow_line_penalty = 0`, apfmt hugs the closure too.
'''
rationale = 'A line that overflows anyway overflows by only a few more columns when indented deeper.'
level = "medium"
tags = ['overflow', 'closure']

[item.style_guide]
conforms = "unspecified"

