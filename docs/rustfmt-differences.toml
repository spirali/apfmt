[[item]]
id = 'macro-trailing-commas'
name = 'Trailing commas in macro arguments'
summary = 'apfmt adds a trailing comma to broken lists nested in macro arguments and removes it from lists on one line; rustfmt does neither.'
description = '''
A broken list (call arguments, struct literal fields, array elements) nested in macro arguments gets a trailing comma, as the Style Guide asks for any broken list. rustfmt omits it inside macro calls.

The last argument of the macro call itself gets no trailing comma in either formatter, because the macro might not accept one. A nested list is parsed as an expression, so a comma there is always valid.

A list on one line has no trailing comma (Style Guide). When a list in macro arguments has a trailing comma and fits on one line, rustfmt keeps the comma.
'''
rationale = 'A nested list is an ordinary expression, so its comma is always valid, and the Style Guide treats it like any other list.'
level = "high"
tags = ['macro', 'comma']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/expressions.html"
conforms = "apfmt"

