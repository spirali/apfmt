[[item]]
id = 'ref-closure-is-other-closure'
name = 'A closure behind `&` counts as another closure argument'
summary = 'apfmt counts a closure behind `&` as another closure argument; rustfmt does not.'
description = '''
The last of several call arguments overflows if it is a closure and "there are no other closure arguments" (Style Guide). apfmt looks through `&` and `&mut`, both for the last argument and for the others, so `&|a| a + 1` counts as another closure. rustfmt hugs the last closure then, while it breaks the same call without the `&`.
'''
rationale = '`&` does not change what the argument is.'
level = "low"
tags = ['call', 'closure', 'hugging']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/expressions.html"
quote = 'there are no other closure arguments'
conforms = "apfmt"

