[[item]]
id = 'arm-block-removed-comment-inside'
name = 'A match arm body loses its block also with a comment inside the expression'
summary = 'apfmt removes the block around a match arm body even with a comment inside the expression; rustfmt keeps it.'
description = '''
"If the body is a single expression with no line comments and not a control flow expression, start it on the same line as the left-hand side" (Style Guide). apfmt reads "no line comments" as comments directly in the block. A block that contains only an expression loses its braces even when a comment is inside that expression, for example in a `match` arm, an `unsafe` block, a closure body or between arguments, and also from nested blocks. rustfmt keeps the block whenever there is a comment anywhere in its text.

A comment directly in the block keeps the block in both. A comment after the block (`=> { f(a) } // c`) keeps it in neither.
'''
rationale = '''apfmt reads the Style Guide's "no line comments" as comments directly in the block.'''
level = "medium"
tags = ['match', 'comment']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/expressions.html"
quote = 'If the body is a single expression with no line comments and not a control flow expression, start it on the same line as the left-hand side'
conforms = "apfmt"

