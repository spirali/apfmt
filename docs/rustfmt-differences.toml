[[item]]
id = 'for-break-before-in'
name = '`for` breaks before `in`'
summary = 'apfmt breaks a `for` head before `in`, as the Style Guide asks; rustfmt breaks after `in`.'
description = '''
The Style Guide breaks a `for` head that does not fit before `in`, and block-indents the `in` line. rustfmt breaks after `in`. The style team settled this rule in [style-team#62](https://github.com/rust-lang/style-team/issues/62) ("the `in` and `=` should go on the next line, like other binops"), but rustfmt never implemented it.

The same applies after a broken or-pattern: its last line takes the `in` only when the iterable fits there too.

An iterable that does not fit on the line of `for` is not broken there either, unless the `in` line cannot be on a single line: apfmt prefers breaking before `in` to breaking the iterable on the line of `for`. Neither the Style Guide nor the style team discussion ranks these two options. A chain wider than `chain_width` cannot be on the `in` line, so it breaks before every `.` on the line of `for`, as in rustfmt and as in `if` and `while`.

The Style Guide also allows a head whose last line is closing delimiters followed by ` {`. apfmt uses this for an iterable that cannot be on a single line, such as a hugged closure, as rustfmt does. After a broken pattern and a broken iterable, ` {` follows the closing delimiters, while rustfmt breaks after `in`.
'''
rationale = 'This is the Style Guide rule, settled in style-team#62 and never implemented in rustfmt.'
level = "medium"
tags = ['loop']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/expressions.html"
conforms = "apfmt"

[[item.references]]
title = 'style-team#62'
url = 'https://github.com/rust-lang/style-team/issues/62'

