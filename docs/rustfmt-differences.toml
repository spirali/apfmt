[[item]]
id = 'comment-after-opener-stays'
name = 'Comments after an opening delimiter stay on its line'
summary = 'apfmt keeps a comment that ends the line of an opening delimiter on that line; rustfmt moves it to the next line.'
description = '''
A comment that ends the line of `(`, `{` or `[` stays there, after a space. If the line would then exceed `max_width`, the comment moves to the first line of the body. rustfmt moves such a comment to the next line.

A block comment followed by code on the line of the opening delimiter does not end the line. apfmt keeps it in front of that code, while rustfmt puts the comment and the code on separate lines. The same rule holds for blocks and broken lists.
'''
rationale = 'The comment stays where its author put it.'
level = "medium"
tags = ['comment']

[item.style_guide]
