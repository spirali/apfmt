[[item]]
id = 'aligned-trailing-comments'
name = 'Aligned trailing comments within a width limit'
summary = 'Both align trailing comments, but apfmt leaves out items far wider than the rest and aligns in a few cases where rustfmt does not.'
description = '''
Both formatters align the trailing comments of list items on consecutive lines, although the Style Guide asks for a single space. rustfmt aligns them to the widest item, however far right that pushes the comments and even if a line then exceeds `max_width`.

apfmt leaves out items that are much wider than the others: at most a quarter of the items (or a single item), when more than `trailing_comment_align_threshold` columns (40 by default) separate them from the rest. It also leaves out lines that alignment would push past `max_width`. These lines keep a single space.

apfmt also aligns in three cases where rustfmt keeps a single space. Neither choice is clearly better: apfmt has one rule, and rustfmt changes less of the source.

- **Long comments**: whether rustfmt aligns depends on the length of the comments. It would align the items in the sample below if their comments were cut short.
- **Rows of filled items**: rustfmt never aligns them.
- **After an item with a doc comment or an attribute**: rustfmt does not align that item with the next one, even though their code is on consecutive lines.
'''
rationale = 'A single very wide item should not push every comment far to the right. The extra cases follow from having one rule.'
level = "medium"
tags = ['comment', 'alignment']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/index.html"
conforms = "neither"

