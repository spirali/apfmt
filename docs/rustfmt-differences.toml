summary = 'apfmt keeps the relative columns of a multi-line block comment when it moves; rustfmt reindents its lines.'
description = '''
When a multi-line block comment moves, apfmt keeps the columns of its lines relative to its start. rustfmt reindents every line to the indentation of the code. apfmt prints a comment unchanged if one of its lines is indented less than the start of the comment or with a tab, because the relative columns cannot be kept.
'''
rationale = 'The text of the comment keeps its shape, such as aligned lines.'
level = "medium"
tags = ['comment']

[item.style_guide]
conforms = "unspecified"

