[[item]]
id = 'macro-punct-joining'
name = 'Macro arguments keep the joining of their punctuation'
summary = 'apfmt leaves macro arguments unchanged when formatting would add or remove a space between punctuation characters; rustfmt reformats them.'
description = '''
A procedural macro can see whether two punctuation characters are written next to each other, and its custom syntax may read them as one operator, such as `<-`, `<->` or `--`. apfmt formats macro arguments that parse as an expression only if every such pair stays as written. Otherwise it copies the arguments unchanged, just as it copies arguments that do not parse.

rustfmt formats them anyway (it only leaves `x<-y` alone), which can change what the macro does.

Commas, semicolons and the spacing after `?` are not checked, because they are never part of an operator.
'''
rationale = 'Adding or removing a space between punctuation characters can change what a procedural macro does.'
level = "high"
tags = ['macro']

[item.style_guide]
conforms = "unspecified"

