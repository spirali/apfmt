[[item]]
id = 'use-normalized'
name = 'Normalized imports'
summary = 'apfmt normalizes imports at any depth and keeps duplicate names; rustfmt does the opposite in both.'
description = '''
apfmt applies the Style Guide's normalizations at any depth. It removes an empty `b::{}` in a list, where rustfmt leaves `use a::{ x};` for `use a::{x, b::{}};`, and removes the braces of a list that has become a single item.

rustfmt removes duplicate names in a list (`use a::{b, b};` becomes `use a::{b};`). apfmt keeps them, because the Style Guide does not ask for their removal.

rustfmt can fail on such imports with the error "left behind trailing whitespace". apfmt does not.
'''
rationale = '''The Style Guide's normalizations apply at any depth, and it does not ask to remove duplicates.'''
level = "low"
tags = ['use']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/items.html"
conforms = "apfmt"

