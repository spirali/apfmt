[workspace]
resolver = "3"
members = ["apfmt","apfmt-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spirali/afmt"

[profile.release]
# Optimize across crates (`apfmt`, `apfmt-core`, `ra_ap_syntax`) as one unit
lto = "fat"
codegen-units = 1
# apfmt never catches panics, so unwinding buys nothing; the panic message is still printed
panic = "abort"
