[[item]]
id = 'return-bounds-break'
name = 'The bounds of a return type break where the line does not fit, block-indented'
summary = 'apfmt breaks return type bounds before every `+` and block-indents them; rustfmt overflows or keeps them at the indentation of `fn`.'
description = '''
After broken parameters, a return type with `+` that does not fit on the line of `)` is broken before every `+`. rustfmt leaves it on one line, over `max_width`.

With no parameters to break, apfmt block-indents the `+` lines of a broken `impl` type: "Break types with `+` by breaking before the `+` and block-indenting the subsequent lines" (Style Guide). rustfmt keeps them at the indentation of `fn`.
'''
rationale = 'This is the Style Guide rule for `+` in types.'
level = "low"
tags = ['fn', 'type']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/types.html"
quote = 'Break types with `+` by breaking before the `+` and block-indenting the subsequent lines'
conforms = "apfmt"

