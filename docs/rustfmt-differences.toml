[[item]]
id = 'closure-match-body-braces'
name = '`{ match ... }` as a closure body keeps its braces where the head does not fit'
summary = '''apfmt and rustfmt differ on when the braces around a closure's `match` body are removed.'''
description = '''
"Use closures without the enclosing `{}`, if possible" (Style Guide). `match` is not a control-flow expression for this rule, so both formatters remove the braces of `|x| { match x { ... } }`. They differ in these cases:

- When `|x| match head {` does not fit on one line, apfmt keeps the braces, and breaks the head inside them if it does not fit there either. rustfmt removes them and breaks the head. A closure without braces in the source stays without them in both.
- With a comment inside the `match`, rustfmt keeps the braces, and apfmt removes them.
- In nested blocks `{ { x } }` with a long body or after broken parameters, apfmt removes the outer braces, and rustfmt keeps them.
'''
rationale = 'Removing the braces would save a level of indentation but split the `match` line. The Style Guide prefers no braces: rustfmt follows it in the first case and apfmt in the second.'
level = "medium"
tags = ['closure', 'match']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/expressions.html"
quote = 'Use closures without the enclosing `{}`, if possible'
conforms = "rustfmt"

