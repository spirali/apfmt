[[item]]
id = 'if-let-guard-rhs'
name = 'The right side of an `if let` guard moves after `=` as in `if let`'
summary = 'apfmt moves the right side of an `if let` guard after `=`, as in `if let`; rustfmt breaks the pattern instead.'
description = '''
"Prefer breaking after the `=` for any `let` sub-expression in an `if` or `while` expression that does not fit" (Style Guide). apfmt reads a match arm guard the same way: the right side moves to the next line if it fits on one line there. rustfmt does so in `if let`, but in a guard it breaks the pattern.
'''
rationale = 'apfmt reads a match arm guard the same way as an `if`. Such guards are rare in practice.'
level = "low"
tags = ['match', 'let']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/expressions.html"
quote = 'Prefer breaking after the `=` for any `let` sub-expression in an `if` or `while` expression that does not fit'
conforms = "apfmt"

[[item.samples]]
title = 'Guards of several shapes'
edition = "2024"
input = '''
fn main() {
    match x {
        // The right side does not fit on one line on the next line: both tuples break, as in `if let`
        A if let (Aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, Bbbbbbbbbbbbbbbbbbbbbbbbbbbb, Ccccccccccccccc) = (aaaaaaaaaaaaaaaaaaaaaaaaa, bbbbbbbbbbbbbbbbbbbbbb, cccccccccccccccc) => { 1 }
        // It fits there: it moves after `=`, as in `if let`
        A if let Some(Aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa) = compute(aaaaaaaaaaaaaaaaaaaaaaaaa, bbbbbbbbbbbbbbbbbbbbbb) => { 2 }
        // A chain breaks on the line of `=`
        A if let Some(Aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa) = self.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.compute_something(aaaaaaaaaaaaa, bbbbbbbbbbbbbbbbbbbbbb) => { 3 }
        // A let chain is not affected
        A if let Some(a) = b && let (Aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, Bbbbbbbbbbbbbbbbbbbbbbbbbbbb, Cccc) = (aaaaaaaaaaaaaaaaaaaaaaaaa, bbbbbbbbbbbbbbbbbbbbbb, cccccccccccccccc) => { 4 }
    }
}
'''
