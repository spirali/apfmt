[[item]]
id = 'let-else-placement'
name = '`else` of a `let`-`else` after a single-line initializer'
summary = 'apfmt follows the Style Guide for `else` after a single-line initializer; rustfmt moves the initializer to the next line at exactly `max_width`.'
description = '''
"If the let statement components preceding the else can be formatted on a single line, but the else { does not fit on the same line, break the line before the else" (Style Guide). rustfmt keeps a column free for the `;` of a plain `let`, so when the pattern and the initializer take exactly `max_width`, it moves the initializer to the next line.

`else {` follows the initializer only when its last line is just closing delimiters at the indentation of `let` (Style Guide). After a chain whose last element follows the closing delimiter, that line is `).method()`, so `else` goes on its own line. rustfmt puts `.method() else {` on a line of its own. After a broken pattern, `) else {` stays on the last line of the initializer, where rustfmt writes `)` and `else {` on separate lines. A pattern that fits on one line is not broken to keep the initializer on the line of `=`.
'''
rationale = 'This is the Style Guide rule; rustfmt keeps a column free for a `;` that a `let`-`else` does not have there.'
level = "low"
tags = ['let']
related = ['chain-after-broken-root']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/statements.html"
quote = 'If the let statement components preceding the else can be formatted on a single line, but the else { does not fit on the same line, break the line before the else'
conforms = "apfmt"

