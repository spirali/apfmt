[[item]]
id = 'macro-string-text-kept'
name = 'A string in a copied macro body keeps its text'
summary = 'When a macro body that cannot be parsed is reindented, apfmt leaves the text of its string literals alone; rustfmt shifts it and so changes the string.'
description = '''
A macro body that does not parse is copied and reindented with its statement. apfmt keeps the lines of a multi-line string literal exactly as they are. rustfmt shifts them along with the code, which changes the value of the string.
'''
rationale = 'Changing the value of a string is not a formatting decision.'
level = "high"
tags = ['macro', 'string']

