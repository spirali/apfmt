[[item]]
id = 'use-list-after-long-path'
name = 'A use list after a too long path is broken'
summary = 'apfmt breaks a `use` list after a path that is too long; rustfmt leaves the line too long.'
description = '''
When `use path::{a, b};` exceeds `max_width` because of a long path, rustfmt leaves the line too long. apfmt breaks the list, as the Style Guide describes: "If an import does require multiple lines ..., then break after the opening brace and before the closing brace, use a trailing comma, and block indent the names". Less of the line then overflows. The path itself is never broken.
'''
rationale = 'Less of the line overflows, and the Style Guide says how to break a list.'
level = "low"
tags = ['use', 'overflow']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/items.html"
quote = 'If an import does require multiple lines'
conforms = "apfmt"

