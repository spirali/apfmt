[[item]]
id = 'rhs-next-line-by-lines-saved'
name = 'The right side of `=` moves to the next line by the lines it saves'
summary = 'apfmt moves the right side of `=` to the next line only when that saves enough lines; rustfmt moves it for any saved line or because of how its first line ends.'
description = '''
When the right side of a `let`, an assignment or a `let`-`else` is broken on the line of `=`, apfmt moves it to the next line (block-indented) only when that saves at least two lines. One saved line is enough for two shapes: a chain that is on one line except for the arguments of its last element, and a call whose single argument hugs it. rustfmt moves the right side whenever the next line saves one line. In a few statements, rustfmt's result is therefore one line shorter.

rustfmt also moves the right side when its first line on the line of `=` ends with `(`, `{` or `[` and on the next line does not, however many lines it takes there. apfmt goes only by the number of lines. rustfmt's rule can cost lines: on the next line, a chain that no longer fits on one line is broken before every element.

A broken `match` or `if` head on the line of `=` stays there in apfmt when moving it saves no line. rustfmt moves it because its first line ends with `(`.
'''
rationale = '''Moving for every saved line would make apfmt differ from rustfmt more often, and rustfmt's first-line rule can take more lines.'''
level = "medium"
tags = ['let']

[item.style_guide]
conforms = "unspecified"

