[package]
name = "afmt-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2"
ra_ap_parser = "0.0.359"
ra_ap_syntax = "0.0.359"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
smallvec = "1.16"
toml = { version = "1.1", default-features = false, features = ["display", "parse", "serde", "std"] }
unicode-width = "0.2"
