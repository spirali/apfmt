[[item]]
id = 'arm-match-head-in-block'
name = 'A `match` head that fits on one line only in the block goes in the block'
summary = 'apfmt puts a `match` head in the block of its arm when it fits on one line only there; rustfmt may put `{` on its own line.'
description = '''
A `match` as an arm body stays on the line of `=>` when its head and ` {` fit there. Otherwise, if the head fits on one line inside a block, apfmt puts it in the block. rustfmt does that too when the head itself does not fit, but when only ` {` does not, it puts `{` on a line of its own.

A head that breaks either way follows the braces of the source in both formatters. The Style Guide does not say whether `match` is a control-flow expression, which would require a block.
'''
rationale = 'It avoids a `{` on a line of its own.'
level = "medium"
tags = ['match']

