[[item]]
id = 'single-arg-fn-call-width'
name = 'A single call argument wider than `fn_call_width` goes on its own line'
summary = 'In apfmt, a breakable single argument wider than `fn_call_width` is never on one line in the call; rustfmt allows that if the call fits within `max_width`.'
description = '''
A single call argument that can break and is wider than `fn_call_width` is not kept on one line in the call, even where it would fit. apfmt hugs it if its first line (`inner(`) is within `fn_call_width`, and otherwise puts it on its own line. rustfmt hugs under the same condition, but otherwise puts the whole call on one line if it fits within `max_width`. As a result, a longer function name can take fewer lines than a shorter one.

An argument that cannot break at all, such as `a::B::new()`, stays on one line within `max_width` in both formatters.
'''
rationale = 'A longer argument then never takes fewer lines than a shorter one.'
level = "medium"
tags = ['call', 'hugging', 'width']

[item.style_guide]
conforms = "unspecified"

