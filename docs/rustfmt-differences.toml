[[item]]
id = 'callee-not-broken'
name = 'A callee is broken only where the arguments cannot be'
summary = 'apfmt breaks a callee only where the arguments cannot be broken; rustfmt may break inside its generic arguments.'
description = '''
"Prefer not to break a line in the callee expression" (Style Guide), so apfmt breaks the arguments first. rustfmt breaks inside the generic arguments of a callee path when that saves lines.

A callee that cannot be on one line keeps the arguments on its last line (`})(input)`) in both formatters. The Style Guide would put them one per line ("or the callee is multi-line"), which would break the common pattern of a closure called immediately.

A callee in parentheses stays together in both formatters.
'''
rationale = 'This is the Style Guide preference.'
level = "low"
tags = ['call']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/expressions.html"
quote = 'Prefer not to break a line in the callee expression'
