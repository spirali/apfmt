[[item]]
id = 'or-pattern-fill'
name = 'Or-patterns of single tokens are filled'
summary = 'apfmt fills or-patterns of single tokens on lines whatever their width; rustfmt limits each alternative to 20 characters.'
description = '''
The Style Guide fills an or-pattern on lines when every alternative is _small_ (a single token, `&` of one, or `(one,)`). rustfmt also requires each alternative to be at most 20 characters wide, so it puts longer names one per line, and it leaves room for ` =>` on every line of the pattern.

With a comment among the alternatives, a pattern that does not fit on one line has one alternative per line in apfmt, as a pattern with larger alternatives does. rustfmt leaves such a pattern as written, including its spacing. The Style Guide does not mention comments here.
'''
rationale = 'The Style Guide fills small alternatives, with no limit on their width.'
level = "low"
tags = ['match', 'pattern', 'comment']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/expressions.html"
conforms = "apfmt"

