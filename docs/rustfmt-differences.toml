[[item]]
id = 'short-chain-broken-before-dot'
name = 'A short chain is broken before `.` to keep its arguments on one line'
summary = 'apfmt breaks a short chain before `.` to keep its arguments on one line; rustfmt keeps the chain on one line and breaks the arguments.'
description = '''
When breaking a chain before each element lets every element fit on one line, apfmt prefers that to keeping the chain on one line with the arguments of its last element one per line, even with a single element. A receiver followed by `.method(a, b, c);` takes two lines where rustfmt takes five.

The Style Guide breaks a chain that does not fit before each element and prefers each element on one line. rustfmt keeps such a short chain on one line and breaks the arguments of its last element. In the head of a control-flow expression, `{` then goes on its own line.
'''
rationale = 'It takes fewer lines, and the Style Guide prefers each element on one line. Neither layout is clearly better.'
level = "medium"
tags = ['chain']

[item.style_guide]
