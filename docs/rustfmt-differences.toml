[[item]]
id = 'empty-file-stays-empty'
name = 'An empty file stays empty'
summary = 'apfmt leaves an empty file empty; rustfmt writes a single line break.'
description = '''
A file with no code or comments (empty, or only whitespace) is formatted to an empty file. rustfmt writes a single line break. Any other output ends with exactly one line break in both formatters.
'''
rationale = 'Nothing is added to a file without code or comments.'
level = "low"
tags = ['whitespace']

