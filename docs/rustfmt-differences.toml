[[item]]
id = 'closure-params-avoid-overflow'
name = 'Closure parameters break to avoid an overflow in the body'
summary = 'apfmt breaks closure parameters to avoid an overflow in the body; rustfmt moves the closure to the next line and lets the line overflow.'
description = '''
When the parameters of a closure after `=` fit on the next line but a line of the body then overflows, apfmt keeps the closure on the line of `=` with its parameters aligned, so the body is indented one level less. rustfmt moves it to the next line and lets the line overflow.
'''
rationale = 'apfmt stays within `max_width` and takes one more line. Neither layout is clearly better.'
level = "low"
tags = ['closure', 'overflow']

[item.style_guide]
conforms = "unspecified"

