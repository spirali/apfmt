[[item]]
id = 'chain-after-broken-root'
name = 'A last chain element follows the closing delimiter'
summary = 'When the start of a chain spans several lines, apfmt puts a single remaining element right after the closing delimiter (`).await?`); rustfmt puts it on its own line.'
description = '''
When the first part of a chain (its _root_) spans several lines, the Style Guide joins the next element to the closing line and block-indents any others. Neither formatter follows this. With two or more remaining elements, apfmt does what rustfmt does: each element goes on its own line at the indentation of the root. They differ when only one element remains: apfmt puts it after the closing delimiter, and rustfmt puts it on its own line. If the element does not fit after the delimiter, apfmt puts it on its own line too.

In the head of an `if let`, a `while let` or a let chain, the line this saves lets apfmt move the whole expression to the line after `=`, as the Style Guide prefers: "prefer breaking after the `=` for any `let` sub-expression in an `if` or `while` expression that does not fit". rustfmt keeps the chain broken on the line of `=`. In a plain `let` statement, apfmt also keeps a multi-line expression on the line of `=`, unless moving it saves at least two lines.
'''
rationale = 'It saves a line and keeps the element attached to the call it applies to.'
level = "high"
tags = ['chain']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/expressions.html"
conforms = "neither"

