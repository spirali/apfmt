[[item]]
id = 'attr-args-as-call-args'
name = 'Attribute arguments are laid out as call arguments'
summary = 'apfmt lays out attribute arguments like call arguments, always with a trailing comma when broken; rustfmt writes the comma only if the source has it.'
description = '''
The Style Guide says: "For attributes with argument lists, format like functions." apfmt does this for `#[derive(...)]`, `#[cfg(...)]`, `#[cfg_attr(...)]` and similar attributes, within the `attr_fn_like_width` limit: the arguments go on one line, or one per line with a trailing comma. Both formatters make one exception and fill a broken `derive` list with several names per line.

rustfmt differs in three ways:

- In a broken list, nested or not, it writes a trailing comma only if the source has one. apfmt always writes it; built-in attributes and common procedural macros accept it.
- On one line, it removes the trailing comma of the attribute's own list but keeps one in a nested list (`cfg(all(a, b,))`). apfmt removes both.
- If a value is not a literal (`sql_type = a::b`), it leaves the attribute on one line as long as it fits within `max_width`. apfmt applies `attr_fn_like_width` here too.
'''
rationale = 'The Style Guide formats attribute argument lists like function calls, whatever the source has.'
level = "high"
tags = ['attribute', 'comma']
related = ['multiline-string-hug-as-source']

[item.style_guide]
url = "https://doc.rust-lang.org/style-guide/items.html"
quote = 'For attributes with argument lists, format like functions.'
conforms = "apfmt"

