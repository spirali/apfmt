[[item]]
id = 'widths-measured-exactly'
name = 'Widths are measured exactly'
summary = 'apfmt applies width limits exactly; rustfmt is one or two columns stricter in some places.'
description = '''
apfmt applies `max_width` and the width heuristics to the exact width of a line or a part of it. With the default settings, rustfmt is one or two columns stricter in these places:

- A `use` item with a list fits on one line only within 98 columns. apfmt keeps it on one line up to `max_width` (100).
- `{` follows a return type after broken parameters only within `max_width` minus the indentation of the line: `) -> Ret {` must end within 96 columns at an indentation of 4 and 84 at 16, as if the indentation were counted twice. apfmt keeps it there up to `max_width`.
- A chain ending with `?` fits on one line only within `chain_width - 1` (59). Without the `?`, and in apfmt in both cases, the limit is `chain_width` (60). The whole line of such a chain also fits only within `max_width - 1` (99).
- Filled lists (the items of a broken `use` list, and arrays or arguments of simple items) are filled up to column 99. apfmt fills them up to `max_width`.
- Nested hugs add up: rustfmt reserves a column for each inner `)`, so `Ok(Bar(ppp(` exactly within `fn_call_width` is not hugged.
- The right side after a broken `if let` pattern stays on the line of `})` only within 97 columns, or 95 for a chain ending with `?`. apfmt keeps it there up to `max_width`.
'''
rationale = 'A limit of 100 columns then means 100 columns everywhere.'
level = "low"
tags = ['width']

[item.style_guide]
conforms = "unspecified"

