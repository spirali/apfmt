[[item]]
id = 'code-around-long-line'
name = 'Code around a line that does not fit is still formatted'
summary = 'When one part of an expression does not fit, apfmt still formats the rest; rustfmt often leaves the whole expression as written.'
description = '''
When a part of an expression cannot fit within the line width, rustfmt often gives up and leaves the whole expression as written, including its layout, indentation and punctuation. apfmt formats everything around the long part.

This also explains other differences in such code: rustfmt keeps details of the source there that it would normally change, such as the spacing of `quote::quote!{`.
'''
rationale = 'One long string should not exempt a whole expression from formatting.'
level = "high"
tags = ['overflow', 'give-up']
related = ['overflowing-lines-do-not-decide']

