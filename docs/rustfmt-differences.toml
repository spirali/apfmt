[[item]]
id = 'chain-blank-lines-kept'
name = 'Blank lines between the elements of a method chain are kept'
summary = 'apfmt keeps blank lines between the elements of a broken method chain; rustfmt leaves such a statement as written or removes them.'
description = '''
apfmt keeps a blank line between the elements of a broken method chain, even without a comment after it, because it groups the calls of a builder. rustfmt usually leaves such a statement as written, and otherwise removes the blank line. The Style Guide has no rule for this. Prettier keeps these blank lines too, but also breaks the chain because of them, while apfmt joins a chain that fits on one line and drops them.

Operator chains are different: in both formatters, their operands lose blank lines unless a comment follows, as call arguments do.
'''
rationale = 'Blank lines group the calls of a builder. Prettier keeps them too.'
level = "medium"
tags = ['chain', 'blank-lines']

