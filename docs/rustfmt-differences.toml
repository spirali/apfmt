[[item]]
id = 'comments-never-dropped'
name = 'Comments are never dropped'
summary = 'rustfmt drops comments in some positions; apfmt keeps every comment.'
description = '''
rustfmt silently deletes comments in several positions, such as around `->`, inside parenthesized types and bounds, and inside `use` declarations. apfmt keeps all of them, at or close to where they were written.
'''
rationale = 'A formatter must not lose text the author wrote.'
level = "high"
tags = ['comment']

[item.style_guide]
conforms = "unspecified"

