[[item]]
id = 'single-arg-not-hugged'
name = 'A single argument is not hugged when it fits on its own line'
summary = 'When the only argument does not fit on the line of the call, apfmt puts it on its own line if it fits there; rustfmt hugs it and breaks its contents.'
description = '''
_Hugging_ means that the inner delimiters stay next to the outer ones and only the contents are broken, with `outer(inner(` on the first line and `))` on the last. When the only argument of a call is another call or a tuple that does not fit on the line, rustfmt hugs it. apfmt puts the argument on its own indented line if it fits there, which takes fewer lines. The same applies to a tuple that is the only element of an array.

A one-element tuple `(x,)` as the only argument either hugs like any other delimited argument or goes on its own line. rustfmt instead breaks the chain inside it at its root and closes the tuple with `,)` on the line of the last element.
'''
rationale = 'It takes fewer lines.'
level = "high"
tags = ['call', 'hugging']

[item.style_guide]
conforms = "unspecified"

