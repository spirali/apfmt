[[item]]
id = 'newline-auto-keeps-endings'
name = '`newline_style = "Auto"` keeps the line endings of the file'
summary = 'With `newline_style = "Auto"`, apfmt keeps the line endings of the file; rustfmt converts `\r\n` to `\n` when it changes anything.'
description = '''
rustfmt documents `Auto` (the default) as "Use the line ending style of the first line ending found in the file". In practice, it always writes `\n` when formatting changes anything in the file, so a file with `\r\n` line endings is converted unless it is already formatted. apfmt does what the option says and writes the line endings of the first line of the source, so such a file keeps `\r\n` on every line. `Unix`, `Windows` and `Native` behave as in rustfmt.
'''
rationale = 'That is what the option is documented to do.'
level = "low"
tags = ['whitespace', 'config']

[item.style_guide]
conforms = "unspecified"

[[item.samples]]
title = 'A file with `\r\n` line endings that needs formatting'
edition = "2024"
input = "fn main() {  }\r\nfn g() {  }\r\n"

[[item.samples.outputs]]
versions = ['apfmt-c9342b5']
output = "fn main() {}\r\nfn g() {}\r\n"

[[item.samples.outputs]]
versions = ['rustfmt-1.10.0']
output = '''
fn main() {}
fn g() {}
'''

