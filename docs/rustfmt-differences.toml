[[item]]
id = 'cast-series-break-first'
name = 'A series of casts breaks before the first `as` only'
summary = 'apfmt breaks a series of casts before the first `as` only; rustfmt breaks before a later `as`.'
description = '''
The Style Guide says: "if chaining a series of `as` casts that require line-breaking, and line-breaking before the first `as` suffices to make the remainder fit on the next line, don't break before any subsequent `as`; instead, leave the series of types all on the same line". rustfmt breaks before a later `as` instead.

Both formatters break a single cast before `as`, and both allow `as T` to follow a broken operand on its last line.
'''
rationale = 'This is the Style Guide rule.'
level = "low"
tags = ['expression']

