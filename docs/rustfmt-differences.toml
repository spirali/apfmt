[[item]]
id = 'macro-rules-transcribers'
name = '`macro_rules!` transcribers are formatted where they parse'
summary = 'apfmt formats `macro_rules!` transcribers wherever they parse; rustfmt often leaves a `macro_rules!` as written.'
description = '''
apfmt formats a transcriber (the right-hand side of a rule) when it parses as items or statements once its metavariables are replaced. `m!{` gets its space, a `{ $x }` body breaks like a block, and calls and chains inside are laid out as anywhere else.

A transcriber that does not parse is copied and reindented with its rule, so it moves when the indentation of the `macro_rules!` changes. rustfmt often leaves a `macro_rules!` exactly as written, including its indentation: code indented with `tab_spaces = 2` stays that way even under the default configuration.
'''
rationale = 'A macro definition is code too, and should not keep its old indentation.'
level = "high"
tags = ['macro']

[item.style_guide]
conforms = "unspecified"

