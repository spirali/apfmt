[[item]]
id = 'impl-empty-body-where'
name = '`where` of an `impl` with an empty body is on its own line'
summary = 'apfmt puts `where` on its own line even when the `impl` body is empty; rustfmt keeps a short `impl` and its `where` on one line.'
description = '''
The Style Guide puts `where` on its own line. With an empty body, rustfmt keeps a short `impl` and its `where` on one line (`impl<I> A for B<I> where I: C {}`). On a header that fills the line, it leaves `where` at the end of the line and drops the trailing comma of the predicate.

The Style Guide also asks for an empty `impl` to be on one line, so it contradicts itself here.
