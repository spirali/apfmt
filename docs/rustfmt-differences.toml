[[item]]
id = 'struct-pattern-one-field-per-line'
name = 'A broken struct pattern has one field per line'
summary = 'apfmt puts each field of a broken struct pattern on its own line; rustfmt can put all fields on one indented line.'
description = '''
The Style Guide formats patterns like the corresponding expressions, so a struct pattern that does not fit within `struct_lit_width` has one field per line, with `..` last and no comma. rustfmt puts all the fields on one indented line when they fit within `struct_lit_width` without `..` but not with `, ..` added. With more fields, it also uses one per line.
