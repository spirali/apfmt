[[item]]
id = 'module-extern-edge-blank-lines'
name = 'Blank lines at the start and end of a module or extern block are removed'
summary = 'apfmt removes blank lines at the start and end of every body; rustfmt keeps some in inline modules and extern blocks.'
description = '''
apfmt removes blank lines after `{` and before `}` of every body of items or statements. rustfmt does the same for functions, impls and traits, but keeps the blank lines after `{` of an inline module and at both ends of an extern block. The Style Guide does not cover them.

| Body | rustfmt after `{` | rustfmt before `}` | apfmt |
| --- | --- | --- | --- |
| `fn`, `impl`, `trait` | removed | removed | removed |
| `mod m { ... }` | kept | removed | removed |
| `extern "C" { ... }` | kept | kept | removed |
'''
rationale = 'One rule for all bodies.'
level = "medium"
tags = ['module', 'blank-lines']

[item.style_guide]
conforms = "unspecified"

