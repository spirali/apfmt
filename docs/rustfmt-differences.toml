[[item]]
id = 'blank-line-before-comment-kept'
name = 'A blank line before an own-line comment is kept in every list'
summary = 'apfmt keeps a blank line before an own-line comment in every list; rustfmt removes it between call arguments and array elements.'
description = '''
A blank line before an own-line comment separates the comment, which belongs to the next item, from the item above. apfmt keeps it in every list. rustfmt removes it between call arguments and array elements, where it removes all blank lines, as apfmt does when no comment follows. rustfmt decided to remove blank lines inside expressions in [rustfmt #1172](https://github.com/rust-lang/rustfmt/issues/1172) and implemented that in [rustfmt #1822](https://github.com/rust-lang/rustfmt/pull/1822).

Lists of named fields and declarations keep all their blank lines in both formatters when broken one item per line: struct definitions, enum variants, parameters, and struct literals and patterns.

A blank line next to a comment between two attributes of the same kind also stays in apfmt, and rustfmt removes it. Without a comment both remove it, except in `match`: rustfmt also removes the one between an inner attribute and the `#[...]` of the first arm, and apfmt keeps it there, as at the start of a file.
'''
rationale = 'It separates the comment, which belongs to the next item, from the item above.'
level = "medium"
tags = ['comment', 'blank-lines']

[item.style_guide]
conforms = "unspecified"

