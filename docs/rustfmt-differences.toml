[[item]]
id = 'use-alias-sorted'
name = 'Imports that differ only in the alias are sorted'
summary = 'apfmt sorts imports that differ only in the alias; rustfmt keeps their source order.'
description = '''
rustfmt compares `a`, `a as b` and `a as c` as equal and keeps their source order. apfmt sorts them, with no alias first and then by the alias. The Style Guide version-sorts the names, and `a` is a prefix of `a as b`.
'''
rationale = 'The Style Guide version-sorts the names, and `a` is a prefix of `a as b`.'
level = "low"
tags = ['use']

