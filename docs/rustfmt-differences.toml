[[item]]
id = 'multiline-string-hug-as-source'
name = 'A multi-line string hugs the list as in the source'
summary = 'apfmt keeps a multi-line string on the line of the opening delimiter if the source has it there; rustfmt decides by the length of the name in front of it.'
description = '''
A single string literal spanning several lines, as the only call argument, array element, macro argument or attribute argument (including `name = "..."`), stays on the line of the opening delimiter if it is there in the source, and moves to a line of its own if it is not. This follows the author, as Prettier and Ruff do. Code formatted by rustfmt stays as it is, except for the trailing comma of a string left on its own line in an attribute. A tuple `(r#"...",)` or a string with a comment in front of it is always broken.

A hugged string moves only if that can make it fit: when its first line does not fit after the delimiter, or when its last line fits only without the closing delimiter and what follows. If its last line is at least `max_width` wide, moving cannot help, so the string stays hugged, as in Ruff.

rustfmt hugs such a string only after a callee shorter than `tab_spaces` (`f(r#"`, `[r#"`), so the layout depends on the length of the name. It also ignores the width: it hugs after a short callee, in an array and for `name = "..."` even when that overflows, and moves the string after a longer callee even when that does not help. From a last line of 100 columns, it leaves a chain and a bare string in an attribute unformatted.

In an attribute, rustfmt hugs `name = "..."` whenever its first line is at most `attr_fn_like_width` wide, even if the source has it on its own line, and never hugs a bare string. apfmt follows the source in both cases.

The Style Guide does not cover this: a literal is not one of its combinable expressions, and a multi-line argument breaks the call.
'''
rationale = '''The author's choice is kept, as in Prettier and Ruff, while rustfmt's choice depends on the length of the callee.'''
level = "medium"
tags = ['string', 'call', 'hugging']
related = ['attr-args-as-call-args']

[item.style_guide]
conforms = "unspecified"

[[item.references]]
